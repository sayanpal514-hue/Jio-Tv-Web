<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Player · Sportlink</title>
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --primary:#ff3c3c; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Outfit',sans-serif}
.shaka-video-container{
  position:fixed;inset:0;background:#000;
  display:flex;align-items:center;justify-content:center;
}
video{width:100%;height:100%;object-fit:contain;}
/* ── Header ── */
.player-header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:15px 22px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.88) 0%,transparent 100%);
  display:flex;align-items:center;gap:14px;
  transition:opacity .4s ease;
}
.back-btn{
  color:#fff;text-decoration:none;font-size:20px;
  background:rgba(255,255,255,0.12);
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;backdrop-filter:blur(8px);
  transition:all .25s;
}
.back-btn:hover{background:var(--primary);transform:scale(1.1);}
.channel-info{display:flex;align-items:center;gap:11px;overflow:hidden;flex:1;}
.channel-logo{
  height:32px;width:auto;max-width:80px;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(0,0,0,0.7));
  flex-shrink:0;
}
.channel-name{
  color:#fff;font-weight:700;font-size:16px;
  text-shadow:0 2px 8px rgba(0,0,0,0.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.live-pill{
  background:var(--primary);color:#fff;
  font-size:9px;font-weight:800;letter-spacing:1px;
  padding:3px 8px;border-radius:4px;flex-shrink:0;
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
/* ── Watermark ── */
.watermark{
  position:fixed;top:14%;right:5%;z-index:50;pointer-events:none;
  font-size:11px;font-weight:800;letter-spacing:2px;
  color:rgba(255,255,255,0.12);
}
/* ── Boot loader ── */
#boot-loader{
  position:fixed;inset:0;z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:#000;
}
.spin{
  width:42px;height:42px;
  border:3px solid rgba(255,255,255,0.08);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader-label{color:rgba(255,255,255,0.45);font-size:13px;font-weight:500;letter-spacing:.4px;}
/* ── Error / Block overlay ── */
.block-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#181818 0%,#000 100%);
  text-align:center;
}
.block-box{
  padding:40px 36px;max-width:460px;width:90%;
  background:rgba(16,16,16,0.97);border-radius:18px;
  border:1px solid rgba(255,255,255,0.07);
  box-shadow:0 24px 70px rgba(0,0,0,0.7);
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.block-title{font-size:28px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}
.block-sub{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.75;}
.refresh-btn{
  display:inline-block;margin-top:22px;
  padding:10px 28px;border-radius:30px;
  background:var(--primary);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.5px;
  cursor:pointer;border:none;font-family:'Outfit',sans-serif;
  transition:opacity .2s;
}
.refresh-btn:hover{opacity:.85;}
@media(max-width:700px){
  .player-header{padding:10px 14px;}
  .channel-name{font-size:14px;}
  .channel-logo{height:24px;}
  .block-title{font-size:22px;}
  .block-box{padding:28px 22px;}
}
</style>
</head>
<body>
<div class="player-header" id="header">
  <a href="jtv.html" class="back-btn">←</a>
  <div class="channel-info">
    <img id="ch-logo" src="" alt="" class="channel-logo" onerror="this.style.display='none'" style="display:none">
    <span id="ch-name" class="channel-name">Sportlink</span>
  </div>
  <span class="live-pill">● LIVE</span>
</div>
<div class="shaka-video-container" id="player-container">
  <video id="video" autoplay muted playsinline preload="metadata"></video>
</div>
<div class="watermark">SPORTLINK</div>
<div id="boot-loader">
  <div class="spin"></div>
  <div id="loader-label">Fetching playlist…</div>
</div>
<script>
(function(){
  // ── CONFIG ─────────────────────────────────────────────────────────────────
  const M3U_URL    = 'https://sportlink-jiotv10.vercel.app/jtv.m3u';
  const FALLBACK_COOKIE_URL = 'https://allinonereborn2.online/jstrweb2/cookies.json';
  const REFRESH_MS = 7 * 60 * 1000;   // background cookie refresh
  const MAX_RETRY  = 3;
  const LOAD_TIMEOUT_MS = 20000;       // 20 s timeout per load attempt
  const UA = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
  // ──────────────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const loaderEl = $('boot-loader');
  const labelEl  = $('loader-label');
  const headerEl = $('header');
  function setLabel(txt){ if(labelEl) labelEl.textContent = txt; }
  function hideLoader(){ if(loaderEl) loaderEl.style.display = 'none'; }
  function showError(title, msg){
    hideLoader();
    if(headerEl) headerEl.style.display = 'none';
    const video = $('video');
    try{ video.pause(); video.removeAttribute('src'); video.load(); }catch(e){}
    $('player-container').style.display = 'none';
    const ov = document.createElement('div');
    ov.className = 'block-overlay';
    ov.innerHTML = `
      <div class="block-box">
        <div class="block-title">${title}</div>
        <div class="block-sub">${msg}</div>
        <button class="refresh-btn" onclick="location.reload()">↺ Try Again</button>
      </div>`;
    document.body.appendChild(ov);
  }
  /* ── Sandbox guard ── */
  function isSandboxed(){
    try{
      if(window.self===window.top) return false;
      if(window.frameElement?.hasAttribute('sandbox')) return true;
      try{ document.domain=document.domain; }catch(e){ return true; }
      return false;
    }catch(e){ return true; }
  }
  if(isSandboxed()){
    document.addEventListener('DOMContentLoaded', ()=>{
      showError('Access Denied','Open in Chrome browser &amp; disable ad-blockers.');
    });
    return;
  }
  /* ── State ── */
  let allChannels  = [];
  let currentId    = null;
  let retryCount   = 0;
  let refreshTimer = null;
  let player       = null;
  let isLoading    = false;   // prevent concurrent loads
  let fallbackCookies = {};   // store fallback cookies
  let cookieFailCount = 0;    // track cookie fetch failures
  
  function getParam(k){ return new URLSearchParams(location.search).get(k); }
  
  /* ── Fetch fallback cookies ── */
  async function fetchFallbackCookies(){
    try {
      const response = await fetch(FALLBACK_COOKIE_URL + '?_=' + Date.now(), {
        cache: 'no-store'
      });
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      fallbackCookies = data;
      cookieFailCount = 0;
      console.log('[Fallback] Cookies loaded successfully');
      return true;
    } catch(e) {
      cookieFailCount++;
      console.warn('[Fallback] Failed to load cookies:', e);
      if(cookieFailCount >= 3) {
        console.warn('[Fallback] Multiple failures, using existing cookies');
      }
      return false;
    }
  }
  
  /* ── Get cookie for channel ── */
  function getChannelCookie(channelId, channelName) {
    // Try multiple ways to match the channel
    const idStr = String(channelId);
    
    // Direct match by ID
    if(fallbackCookies[idStr]) {
      return fallbackCookies[idStr];
    }
    
    // Try to match by channel name (case insensitive)
    if(channelName) {
      const nameLower = channelName.toLowerCase();
      for(const [key, value] of Object.entries(fallbackCookies)) {
        if(key.toLowerCase() === nameLower) {
          return value;
        }
      }
    }
    
    // Try partial match for common channels
    const commonMatches = {
      'star sports': ['star sports', 'star sports 1', 'star sports 2', 'star sports 3'],
      'sony': ['sony', 'sony ten', 'sony six', 'sony max'],
      'hotstar': ['hotstar', 'disney+ hotstar'],
      'viacom': ['viacom', 'colors', 'mtv'],
      'zee': ['zee', 'zee tv', 'zee cinema'],
      'sports': ['sports', 'sports 18', 'sports channel'],
      'espn': ['espn', 'star sports'],
      'star': ['star', 'star plus', 'star gold']
    };
    
    if(channelName) {
      const nameLower = channelName.toLowerCase();
      for(const [key, values] of Object.entries(commonMatches)) {
        if(values.some(v => nameLower.includes(v) || v.includes(nameLower))) {
          for(const [cookieKey, cookieValue] of Object.entries(fallbackCookies)) {
            if(cookieKey.toLowerCase().includes(key) || key.includes(cookieKey.toLowerCase())) {
              return cookieValue;
            }
          }
        }
      }
    }
    
    // If still no match, try to find any cookie that might work
    const fallbackKeys = Object.keys(fallbackCookies);
    if(fallbackKeys.length > 0) {
      // Try to match first few characters of channel ID
      const idPrefix = idStr.substring(0, 3);
      for(const key of fallbackKeys) {
        if(key.startsWith(idPrefix)) {
          return fallbackCookies[key];
        }
      }
      // Last resort: use the first available cookie
      return fallbackCookies[fallbackKeys[0]];
    }
    
    return null;
  }
  
  /* ── Header auto-hide ── */
  let hideTimer;
  function showHeader(){
    if(!headerEl) return;
    headerEl.style.opacity = '1';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{ headerEl.style.opacity='0'; }, 3500);
  }
  document.addEventListener('mousemove', showHeader);
  document.addEventListener('touchstart', showHeader);
  showHeader();
  
  /* ── M3U parser ── */
  function parseM3U(text){
    const channels = [];
    const lines = text.split(/\r?\n/).map(l=>l.trim());
    let i = 0;
    while(i < lines.length){
      if(!lines[i].startsWith('#EXTINF')){ i++; continue; }
      const inf = lines[i];
      const ch = {
        id:    (inf.match(/tvg-id="([^"]*)"/)      ||[])[1] || '',
        name:  (inf.match(/tvg-name="([^"]*)"/)    ||[])[1] || inf.split(',').pop().trim(),
        logo:  (inf.match(/tvg-logo="([^"]*)"/)    ||[])[1] || '',
        group: (inf.match(/group-title="([^"]*)"/) ||[])[1] || '',
        licenseKey:'', streamUrl:'', isHLS:false, cookie:'', ua:UA
      };
      i++;
      while(i<lines.length && lines[i].startsWith('#KODIPROP')){
        if(lines[i].includes('license_key='))
          ch.licenseKey = lines[i].split('license_key=').pop().trim();
        i++;
      }
      while(i<lines.length && lines[i].startsWith('#')) i++;
      if(i<lines.length && lines[i] && !lines[i].startsWith('#')){
        const raw  = lines[i];
        const pipe = raw.indexOf('|');
        const url  = pipe!==-1 ? raw.substring(0,pipe) : raw;
        ch.streamUrl = url;
        ch.isHLS     = url.includes('.m3u8');
        if(pipe!==-1){
          raw.substring(pipe+1).split('&').forEach(p=>{
            const eq=p.indexOf('='); if(eq===-1) return;
            const k=p.substring(0,eq), v=p.substring(eq+1);
            if(k==='User-Agent') ch.ua     = v;
            if(k==='Cookie')     ch.cookie = v;
          });
        }
        i++;
      }
      if(ch.streamUrl) channels.push(ch);
    }
    return channels;
  }
  
  /* ── Fetch M3U ── */
  async function fetchData(){
    const r = await fetch(M3U_URL+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    allChannels = parseM3U(await r.text());
  }
  
  /* ── ClearKey DRM ── */
  function buildDrm(licKey){
    if(!licKey||!licKey.includes(':')) return null;
    const [kid,key] = licKey.split(':');
    return (kid&&key) ? {drm:{clearKeys:{[kid]:key}}} : null;
  }
  
  /* ── Request filter — adds Cookie header + __hdnea__ to URL ── */
  function applyFilter(ch){
    player.getNetworkingEngine().clearAllRequestFilters();
    player.getNetworkingEngine().registerRequestFilter((type, req)=>{
      req.headers['Referer']    = 'https://www.jiotv.com/';
      req.headers['User-Agent'] = ch.ua;
      
      // Try to get cookie - first from channel, then from fallback
      let cookieValue = ch.cookie || '';
      
      // If no cookie in channel data, try fallback
      if(!cookieValue && Object.keys(fallbackCookies).length > 0) {
        const fallbackCookie = getChannelCookie(ch.id, ch.name);
        if(fallbackCookie) {
          cookieValue = fallbackCookie;
          console.log('[Fallback] Using fallback cookie for channel:', ch.name);
        }
      }
      
      if(cookieValue){
        req.headers['Cookie'] = cookieValue;
        // Strip "Cookie=" prefix if present, extract token value only
        const rawCookie = cookieValue;
        const token = rawCookie.startsWith('__hdnea__=')
          ? rawCookie.substring(10)   // → "st=...~hmac=..."
          : rawCookie;
        // Append to manifest + segment URLs (required by JioTV/Akamai CDN)
        const isMpdOrSeg =
          type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
          type === shaka.net.NetworkingEngine.RequestType.SEGMENT;
        if(isMpdOrSeg && !req.uris[0].includes('__hdnea__')){
          req.uris[0] += (req.uris[0].includes('?') ? '&' : '?') + '__hdnea__=' + token;
        }
      }
    });
  }
  
  /* ── Background refresh ── */
  function scheduleRefresh(){
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(async()=>{
      try{
        // Refresh both M3U and fallback cookies
        await Promise.all([
          fetchData(),
          fetchFallbackCookies()
        ]);
        const ch = allChannels.find(c=>String(c.id)===String(currentId));
        if(ch && !$('video').paused) applyFilter(ch);
      }catch(e){ console.warn('[refresh]',e); }
      scheduleRefresh();
    }, REFRESH_MS);
  }
  
  /* ── Load with timeout wrapper ── */
  function loadWithTimeout(url){
    return Promise.race([
      player.load(url),
      new Promise((_,rej)=> setTimeout(()=> rej(new Error('Timeout after '+LOAD_TIMEOUT_MS+'ms')), LOAD_TIMEOUT_MS))
    ]);
  }
  
  /* ── Load & play ── */
  async function loadChannel(id, isRetry){
    if(isLoading && !isRetry) return;
    isLoading = true;
    if(!isRetry){
      retryCount = 0;
      setLabel('Connecting to stream…');
    }
    
    // Refresh data and fallback cookies on every attempt
    try{ 
      await Promise.all([
        fetchData(),
        fetchFallbackCookies()
      ]);
    } catch(e){ 
      console.warn('[m3u]',e); 
    }
    
    const ch = allChannels.find(c=>String(c.id)===String(id));
    if(!ch){ showError('Not Found','Channel not available.'); isLoading=false; return; }
    currentId = id;
    
    // Update header
    document.title = ch.name + ' | Sportlink';
    $('ch-name').textContent = ch.name;
    const logo = $('ch-logo');
    if(ch.logo){ logo.src=ch.logo; logo.style.display=''; }
    else logo.style.display='none';
    
    try{ await player.unload(); }catch(e){}
    
    // Add fallback cookie to channel if available
    if(!ch.cookie && Object.keys(fallbackCookies).length > 0) {
      const fallbackCookie = getChannelCookie(ch.id, ch.name);
      if(fallbackCookie) {
        ch.cookie = fallbackCookie;
        console.log('[Fallback] Applied fallback cookie to channel:', ch.name);
      }
    }
    
    applyFilter(ch);
    player.configure({
      manifest:  { defaultPresentationDelay:5 },
      streaming: { lowLatencyMode:true, bufferingGoal:10, rebufferingGoal:2, safeSeekOffset:5 }
    });
    
    if(!ch.isHLS){
      const drm = buildDrm(ch.licenseKey);
      if(drm) player.configure(drm);
    }
    
    try{
      await loadWithTimeout(ch.streamUrl);
      $('video').play().catch(()=>{});
      retryCount = 0;
      isLoading  = false;
      hideLoader();
      scheduleRefresh();
    }catch(err){
      console.error('[load] attempt',retryCount+1,'error:',err.message||err);
      if(retryCount < MAX_RETRY){
        retryCount++;
        setLabel('Retry '+retryCount+'/'+MAX_RETRY+' — reconnecting…');
        setTimeout(()=> loadChannel(id, true), 2500);
      }else{
        isLoading = false;
        showError(
          'Stream Error',
          'Unable to play this channel.<br><br>' +
          'The stream token may have expired — ' +
          'try refreshing to get a fresh playlist.'
        );
      }
    }
  }
  
  /* ── Boot ── */
  document.addEventListener('DOMContentLoaded', async()=>{
    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()){
      showError('Unsupported Browser','Use Chrome on desktop or Android.');
      return;
    }
    const video     = $('video');
    const container = $('player-container');
    video.muted = true;
    player = new shaka.Player();
    await player.attach(video);
    
    // Only log Shaka errors — do NOT retry here to avoid loop with loadChannel
    player.addEventListener('error', ev=>{
      console.error('[Shaka error]', ev.detail.code, ev.detail);
    });
    
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      addBigPlayButton: true,
      controlPanelElements:['mute','play_pause','time_and_duration','spacer','quality','picture_in_picture','fullscreen'],
      seekBarColors:{ base:'rgba(255,255,255,0.25)', buffered:'rgba(255,60,60,0.5)', played:'#ff3c3c' }
    });
    
    video.addEventListener('play', ()=>{ video.muted = false; });
    setLabel('Fetching playlist…');
    
    try{
      await Promise.all([
        fetchData(),
        fetchFallbackCookies()
      ]);
    } catch(e){
      showError('Connection Error','Could not load channel list.<br>'+e.message);
      return;
    }
    
    if(!allChannels.length){
      showError('Empty Playlist','Playlist loaded but no channels found.');
      return;
    }
    
    const reqId  = getParam('id') || allChannels[0].id;
    const target = allChannels.find(c=>String(c.id)===String(reqId));
    setLabel('Loading '+(target?.name||'channel')+'…');
    await loadChannel(target ? reqId : allChannels[0].id);
  });
})();
</script>
</body>
</html>
