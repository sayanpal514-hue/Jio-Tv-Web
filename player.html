<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player · Star Sports Live</title>
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff3e3e;
    --bg: #000;
    --surface: rgba(255, 255, 255, 0.05);
    --glass: rgba(0, 0, 0, 0.6);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Outfit', sans-serif}

.shaka-video-container{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* Header/Overlay */
.player-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 15px 25px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.3s ease;
}

.header-left { display: flex; align-items: center; gap: 15px; }
.header-right { display: flex; align-items: center; gap: 10px; }

.back-btn {
    color: white;
    text-decoration: none;
    font-size: 24px;
    background: rgba(255,255,255,0.1);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
}

.back-btn:hover { background: var(--primary); transform: scale(1.1); }

.channel-info { display: flex; align-items: center; gap: 12px; }

.channel-logo {
    height: 35px;
    width: auto;
    max-width: 100px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}

.channel-name {
    color: white;
    font-weight: 700;
    font-size: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.custom-watermark{
position:absolute;
z-index:40;
pointer-events:none;
top:15%;
right:5%;
font-size:12px;
font-weight:800;
color:rgba(255,255,255,0.15);
letter-spacing: 1px;
}

/* Loading Overlay */
#loading-overlay{
position:fixed;
inset:0;
z-index:50;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#000;
gap:16px;
}
.spinner{
width:44px;height:44px;
border:3px solid rgba(255,62,62,0.15);
border-top-color:var(--primary);
border-radius:50%;
animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{font-size:14px;color:rgba(255,255,255,0.5);font-family:'Outfit',sans-serif;letter-spacing:0.5px}
#loading-overlay.hidden{display:none}

/* --- Blocker --- */
.block-overlay{
position:fixed;
inset:0;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
text-align:center;
}

.block-box{
padding:40px;
max-width:500px;
width:90%;
background:rgba(20, 20, 20, 0.95);
border-radius:16px;
border:1px solid rgba(255, 255, 255, 0.1);
box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

.block-title{ font-size:32px; font-weight:800; color:#fff; margin-bottom:15px; text-transform: uppercase;}
.block-sub{ font-size:14px; color:rgba(255,255,255,0.6); line-height:1.6; }
.block-sub a{color:var(--primary);text-decoration:none}

@media(max-width:700px){
    .player-header { padding: 10px 15px; }
    .channel-name { font-size: 15px; }
    .channel-logo { height: 25px; }
}
</style>
</head>
<body>

<!-- Loading Overlay -->
<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-msg">Loading channel…</div>
</div>

<!-- Header -->
<div class="player-header" id="header">
    <div class="header-left">
        <a href="index.html" class="back-btn">←</a>
        <div class="channel-info">
            <img id="ch-logo" src="" alt="" class="channel-logo" onerror="this.style.display='none'">
            <span class="channel-name" id="ch-name">Loading…</span>
        </div>
    </div>
    <div class="header-right">
        <span style="font-family:'Outfit',sans-serif;font-size:20px;color:white;letter-spacing:1px;font-weight:800;">SPORT<span style="color:#ff3e3e;">LINK</span></span>
    </div>
</div>

<!-- Player -->
<div class="shaka-video-container" id="player-container">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">SONYNETWORK-SPORTLINK</div>
</div>

<script>
(function(){
  // ─── Sandbox Guard ───
  function isSandboxedEnv(){
    try {
      if (window.self === window.top) return false;
      if (window.frameElement && window.frameElement.hasAttribute("sandbox")) return true;
      try { document.domain = document.domain; if (window.frameElement && !window.frameElement.getAttribute("sandbox")) return false; } catch (e) { return true; }
      return false;
    } catch(e) { return true; }
  }
  function triggerBlockScreen(title, message){
    const container = document.getElementById("player-container");
    const video = document.getElementById("video");
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e){}
    const overlay = document.createElement("div");
    overlay.className = "block-overlay";
    overlay.innerHTML = `<div class="block-box"><div class="block-title">${title}</div><div class="block-sub">${message}</div></div>`;
    document.body.appendChild(overlay);
    container.style.display = 'none';
    document.getElementById('header').style.display = 'none';
    document.getElementById('loading-overlay').classList.add('hidden');
  }
  if(isSandboxedEnv()){
    triggerBlockScreen('Access Denied', 'Please open in a standard browser and disable ad-blockers.');
    return;
  }

  // ─── Configuration ───
  const CHANNEL_JSON_URL = 'https://sayan-sportlink-sonynetwork.pages.dev/sonyliv.json';
  const COOKIE_URL = "https://allinonereborn2.online/jstrweb2/cookies.json";

  // ─── DOM refs ───
  const video = document.getElementById('video');
  const container = document.getElementById('player-container');
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingMsg = document.getElementById('loading-msg');
  const chName = document.getElementById('ch-name');
  const chLogo = document.getElementById('ch-logo');
  const header = document.getElementById('header');

  // ─── Helpers ───
  function getParam(k){ return new URLSearchParams(location.search).get(k); }
  function setLoadingMsg(msg){ if(loadingMsg) loadingMsg.textContent = msg; }
  function showLoading(){ loadingOverlay.classList.remove('hidden'); }
  function hideLoading(){ loadingOverlay.classList.add('hidden'); }

  // ─── Fetch Cookie (from your demo) ───
  async function fetchCookie() {
    try {
      const res = await fetch(COOKIE_URL, { cache: "no-store" });
      if (!res.ok) return null;
      const ct = res.headers.get("Content-Type") || "";
      if (ct.includes("application/json")) {
        const data = await res.json();
        return extractCookie(data);
      }
      // plain-text fallback
      const text = (await res.text()).trim();
      return text || null;
    } catch(e) { 
      console.warn('Cookie fetch error:', e);
      return null; 
    }
  }

  function extractCookie(data) {
    if (Array.isArray(data)) {
      for (const item of data) {
        const r = extractCookie(item);
        if (r) return r;
      }
    } else if (data && typeof data === "object") {
      if (data.cookie) return String(data.cookie).trim();
      // Check for __hdnea__ directly
      if (data.__hdnea__) return '__hdnea__=' + String(data.__hdnea__).trim();
      // Recursively search values
      for (const v of Object.values(data)) {
        if (typeof v === "object") {
          const r = extractCookie(v);
          if (r) return r;
        }
      }
    }
    return null;
  }

  // ─── Main Player Logic ───
  async function init() {
    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()) {
      return triggerBlockScreen('Browser Unsupported', 'Please use Chrome or Edge.');
    }

    // ─── 1. Fetch channel data ───
    setLoadingMsg('Loading channel data…');
    showLoading();

    let allChannels = [];
    let targetId = getParam('id');
    
    try {
      const res = await fetch(CHANNEL_JSON_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allChannels = await res.json();
    } catch(e) {
      console.error('Channel fetch error:', e);
      return triggerBlockScreen('Connection Error', 'Could not load channel list.<br><a href="index.html">← Go back</a>');
    }

    if (!allChannels || allChannels.length === 0) {
      return triggerBlockScreen('No Channels', 'Channel list is empty.');
    }

    // Find target channel
    let channel = allChannels.find(c => c.id === targetId);
    if (!channel && targetId) {
      // Try by keyId
      channel = allChannels.find(c => c.keyId === targetId);
    }
    if (!channel) channel = allChannels[0];
    if (!channel) return triggerBlockScreen('Error', 'No valid channel found.');

    // Update UI
    chName.textContent = channel.name;
    chLogo.src = channel.logo || '';
    document.title = channel.name + ' · Sportlink';

    // ─── 2. Fetch fresh cookie ───
    setLoadingMsg('Fetching stream token…');
    let cookieValue = null;
    
    // Try cookies URL first
    if (channel.cookies) {
      cookieValue = await fetchCookie();
      if (!cookieValue) {
        console.warn('Cookie fetch failed, trying baked-in cookie');
      }
    }
    
    // Fallback to channel.cookie if available
    if (!cookieValue && channel.cookie) {
      cookieValue = channel.cookie;
    }
    
    // Final fallback: use the baked-in cookie from your demo
    if (!cookieValue) {
      cookieValue = "__hdnea__=st=1784930442~exp=1784952042~acl=/*~hmac=a62f3d1a5ae89d37d883ed450aff14eca0244a2825ed9a8ecc9091fdb67e3bcc";
      console.warn('Using fallback cookie');
    }

    // ─── 3. Setup Shaka Player ───
    setLoadingMsg('Starting stream…');
    
    const player = new shaka.Player();
    await player.attach(video);

    // UI Overlay
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: ["mute","play_pause","time_and_duration","spacer","quality","picture_in_picture","fullscreen"]
    });

    // DRM Config
    const drmConfig = {};
    if (channel.keyId && channel.key) {
      drmConfig.clearKeys = { [channel.keyId]: channel.key };
    }
    player.configure({
      drm: drmConfig,
      manifest: { defaultPresentationDelay: 5 },
      streaming: { 
        lowLatencyMode: true, 
        bufferingGoal: 10, 
        rebufferingGoal: 2,
        safeSeekOffset: 5
      }
    });

    // ─── 4. Request Filter with Cookie ───
    const streamUrl = channel.streamUrl || channel.url;
    if (!streamUrl) {
      return triggerBlockScreen('Error', 'No stream URL available for this channel.');
    }

    player.getNetworkingEngine().clearAllRequestFilters();
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
      request.headers["Referer"] = "https://www.jiotv.com/";
      request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
      
      if (cookieValue) {
        request.headers["Cookie"] = cookieValue;
        
        // Append __hdnea__ to URL if needed
        let urlCookie = cookieValue;
        if (cookieValue.startsWith("__hdnea__=")) {
          urlCookie = cookieValue.substring(10);
        }
        
        const isManifestOrSegment = (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || 
                                     type === shaka.net.NetworkingEngine.RequestType.SEGMENT);
        if (isManifestOrSegment && !request.uris[0].includes("__hdnea__")) {
          const sep = request.uris[0].includes("?") ? "&" : "?";
          request.uris[0] += sep + "__hdnea__=" + urlCookie;
        }
      }
    });

    // ─── 5. Load and Play ───
    try {
      await player.load(streamUrl);
      await video.play().catch(() => {});
      hideLoading();
      
      // Header auto-hide
      let hideTimeout;
      const showHeader = () => {
        header.style.opacity = '1';
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => { header.style.opacity = '0'; }, 3000);
      };
      container.addEventListener('mousemove', showHeader);
      container.addEventListener('touchstart', showHeader);
      showHeader();
      
    } catch(e) {
      console.error('Playback error:', e);
      triggerBlockScreen('Playback Error', 'Stream unavailable right now.<br><a href="index.html">← Back to channels</a>');
    }

    video.addEventListener("play", () => { video.muted = false; });
  }

  // ─── Start ───
  init();
})();
</script>
</body>
</html>
