<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportlink - Jio Tv</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3e3e;
            --bg: #0a0a0b;
            --card-bg: #161618;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 40px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #ff3e3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            max-width: 600px;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #search {
            width: 100%;
            padding: 15px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(22, 22, 24, 0.9);
            backdrop-filter: blur(15px);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.2);
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
            justify-content: center;
        }

        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .channel-card:hover {
            transform: translateY(-5px);
            background: #1c1c1f;
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .logo-container img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .channel-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.2;
            height: 2.4em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .channel-group {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, #1c1c1f 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 600px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
            h1 { font-size: 2.5rem; }
            .logo-container { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Sportlink - Jio Tv</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 5px;">by Sayan10</p>
    </header>

    <div class="search-container">
        <input type="text" id="search" placeholder="Search for channels..." autocomplete="off">
        <div class="filters" id="filters">
            <button class="filter-btn active" data-group="all">All</button>
            <!-- Groups will be injected here -->
        </div>
    </div>

    <div class="channel-grid" id="grid">
        <!-- Initial skeletons -->
        <div class="channel-card skeleton" style="height: 220px"></div>
        <div class="channel-card skeleton" style="height: 220px"></div>
        <div class="channel-card skeleton" style="height: 220px"></div>
        <div class="channel-card skeleton" style="height: 220px"></div>
        <div class="channel-card skeleton" style="height: 220px"></div>
        <div class="channel-card skeleton" style="height: 220px"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const search = document.getElementById('search');
        const filterContainer = document.getElementById('filters');
        let channelsData = [];
        let currentFilter = 'all';

        async function init() {
            try {
                const response = await fetch('Channel/channels.json');
                channelsData = await response.json();
                
                // Extract unique groups
                const groups = [...new Set(channelsData.map(ch => ch.group))].sort();
                groups.forEach(group => {
                    if (group && group !== 'Unknown') {
                        const btn = document.createElement('button');
                        btn.className = 'filter-btn';
                        btn.textContent = group;
                        btn.dataset.group = group;
                        filterContainer.appendChild(btn);
                    }
                });

                setupFilters();
                displayChannels(channelsData);
            } catch (error) {
                console.error('Error loading channels:', error);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Failed to load channels. Run generate_channels.py first.</p>';
            }
        }

        function displayChannels(list) {
            grid.innerHTML = '';
            list.forEach(ch => {
                const card = document.createElement('a');
                card.className = 'channel-card';
                card.href = 'Channel/' + ch.fileName;
                
                const logoUrl = ch.logo || 'https://www.jiotv.com/images/jiotv_logo.png';

                card.innerHTML = `
                    <div class="logo-container">
                        <img src="${logoUrl}" onerror="this.src='https://www.jiotv.com/images/jiotv_logo.png'">
                    </div>
                    <div class="channel-name">${ch.name}</div>
                    <div class="channel-group">${ch.group || 'General'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function setupFilters() {
            filterContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.group;
                    applyFilters();
                }
            });

            search.addEventListener('input', () => {
                applyFilters();
            });
        }

        function applyFilters() {
            const term = search.value.toLowerCase();
            const filtered = channelsData.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(term);
                const matchesGroup = currentFilter === 'all' || ch.group === currentFilter;
                return matchesSearch && matchesGroup;
            });
            displayChannels(filtered);
        }

        init();
    </script>
</body>
</html>
