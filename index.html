<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JioTV Plus · Live Channels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;
  --surface:#0d1020;
  --card:#111623;
  --border:rgba(255,255,255,0.06);
  --accent:#00e5ff;
  --accent2:#ff3d5a;
  --text:#eef2ff;
  --muted:rgba(238,242,255,0.42);
  --radius:13px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
/* BG GRID */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
}
/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(7,9,15,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;
}
.logo{
  font-family:'Bebas Neue',cursive;
  font-size:22px;letter-spacing:3px;
  display:flex;align-items:center;gap:10px;
}
.logo-dot{color:var(--accent)}
.live-badge{
  background:var(--accent2);color:#fff;
  font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:1px;
  animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.header-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
#ist-clock{
  font-size:13px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:0.5px;
}
/* HERO */
.hero{
  position:relative;z-index:1;
  padding:40px 20px 28px;text-align:center;
}
.hero h1{
  font-family:'Bebas Neue',cursive;
  font-size:clamp(38px,9vw,90px);
  letter-spacing:5px;line-height:.95;
}
.hero h1 span{color:var(--accent)}
.hero p{margin-top:10px;color:var(--muted);font-size:13px;letter-spacing:.8px}
#ch-count{color:var(--accent);font-weight:700}
/* SEARCH + FILTER */
.controls{
  position:relative;z-index:1;
  padding:0 20px 20px;
  display:flex;flex-direction:column;gap:12px;
  max-width:1200px;margin:0 auto;
}
.search-wrap{position:relative}
#search{
  width:100%;background:var(--surface);
  border:1px solid var(--border);color:var(--text);
  padding:10px 16px 10px 40px;border-radius:100px;
  font-size:13px;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color .2s;
}
#search:focus{border-color:rgba(0,229,255,0.4)}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;pointer-events:none;
}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);padding:6px 16px;border-radius:100px;
  font-size:11px;font-weight:600;letter-spacing:.4px;
  cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;
}
.filter-btn:hover,.filter-btn.active{
  background:var(--accent);color:#000;border-color:var(--accent);
}
/* GRID */
.grid{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:12px;padding:0 20px 60px;
  max-width:1200px;margin:0 auto;
}
/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  text-decoration:none;color:inherit;
  display:block;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{
  transform:translateY(-5px);
  border-color:rgba(0,229,255,0.3);
  box-shadow:0 14px 40px rgba(0,0,0,0.45),0 0 0 1px rgba(0,229,255,0.08);
}
.card-thumb{
  aspect-ratio:16/9;background:#0a0c18;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-thumb::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,0.65));
}
.card-thumb img{
  width:68px;height:68px;object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  transition:transform .25s;
}
.card:hover .card-thumb img{transform:scale(1.1)}
.card-live{
  position:absolute;top:8px;right:8px;z-index:2;
  background:rgba(0,0,0,0.65);border-radius:100px;
  padding:2px 7px;font-size:9px;font-weight:700;
  color:#ff5a5a;letter-spacing:.5px;
  display:flex;align-items:center;gap:4px;
}
.card-live::before{
  content:'';width:5px;height:5px;
  background:#ff3d5a;border-radius:50%;
  animation:blink 1.2s infinite;
}
.card-body{padding:11px 12px 14px}
.card-name{font-size:12px;font-weight:700;line-height:1.35;letter-spacing:.2px}
.card-tag{
  display:inline-block;margin-top:6px;
  font-size:9px;font-weight:700;letter-spacing:.6px;
  padding:2px 7px;border-radius:4px;
  background:rgba(0,229,255,0.1);color:var(--accent);
  text-transform:uppercase;
}
.card-watch{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:10px;background:var(--accent);color:#000;
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:5px 12px;border-radius:100px;
}
/* LOADING */
#loading{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  padding:80px 0;gap:10px;color:var(--muted);font-size:13px;
}
.spinner{
  width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* FOOTER */
footer{
  position:relative;z-index:1;
  text-align:center;padding:20px;
  font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);
}
@media(max-width:580px){
  .grid{grid-template-columns:repeat(2,1fr);gap:9px;padding:0 12px 40px}
  header,.hero,.controls{padding-left:12px;padding-right:12px}
  .hero h1{font-size:38px}
}
</style>
</head>
<body>
<header>
  <div class="logo">📡 <span class="logo-dot">JIO</span>TV PLUS</div>
  <div class="header-right">
    <div id="ist-clock">--:--:-- IST</div>
    <div class="live-badge">● LIVE</div>
  </div>
</header>
<section class="hero">
  <h1>WATCH <span>LIVE</span><br>TV FREE</h1>
  <p><span id="ch-count">…</span> channels · HD Quality · M3U Playlist</p>
</section>
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" type="text" placeholder="Search channels…" autocomplete="off">
  </div>
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="sports">Sports</button>
    <button class="filter-btn" data-filter="movies">Movies</button>
    <button class="filter-btn" data-filter="entertainment">Entertainment</button>
    <button class="filter-btn" data-filter="kids">Kids</button>
    <button class="filter-btn" data-filter="music">Music</button>
  </div>
</div>
<div id="loading"><div class="spinner"></div> Fetching channels…</div>
<div class="grid" id="grid"></div>
<footer>
  Source: M3U Playlist · ClearKey DRM · Tap any channel to watch
</footer>
<script>
// ── CONFIG: set your M3U playlist URL here ──────────────────────────────────
const M3U_URL = 'https://sportlink-jiotv10.vercel.app/jtv.m3u'; // local file OR remote URL
// ───────────────────────────────────────────────────────────────────────────
// IST clock
function startClock(){
  function tick(){
    const ist = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
    const p = n => String(n).padStart(2,'0');
    document.getElementById('ist-clock').textContent =
      p(ist.getHours())+':'+p(ist.getMinutes())+':'+p(ist.getSeconds())+' IST';
  }
  tick(); setInterval(tick, 1000);
}
startClock();
// ── M3U Parser ───────────────────────────────────────────────────────────────
function parseM3U(text){
  const channels = [];
  const lines = text.split(/\r?\n/).map(l => l.trim());
  let i = 0;
  while(i < lines.length){
    if(!lines[i].startsWith('#EXTINF')) { i++; continue; }
    const extinf = lines[i];
    const ch = {
      id:          (extinf.match(/tvg-id="([^"]*)"/)    || [])[1] || '',
      name:        (extinf.match(/tvg-name="([^"]*)"/)  || [])[1] || extinf.split(',').pop().trim(),
      logo:        (extinf.match(/tvg-logo="([^"]*)"/)  || [])[1] || '',
      group:       (extinf.match(/group-title="([^"]*)"/) || [])[1] || '',
      licenseKey:  '',
      mpd:         '',
      cookie:      '',
      userAgent:   'Droovy'
    };
    i++;
    // Consume KODIPROP lines
    while(i < lines.length && lines[i].startsWith('#KODIPROP')){
      const kp = lines[i];
      if(kp.includes('license_key='))
        ch.licenseKey = kp.split('license_key=').pop().trim();
      i++;
    }
    // Skip any remaining # comment lines
    while(i < lines.length && lines[i].startsWith('#')) i++;
    // URL line (possibly containing |headers)
    if(i < lines.length && lines[i] && !lines[i].startsWith('#')){
      const urlLine = lines[i];
      const pipeIdx = urlLine.indexOf('|');
      if(pipeIdx !== -1){
        ch.mpd = urlLine.substring(0, pipeIdx);
        // Parse key=value pairs after the pipe
        urlLine.substring(pipeIdx + 1).split('&').forEach(pair => {
          const eq = pair.indexOf('=');
          if(eq === -1) return;
          const k = pair.substring(0, eq);
          const v = pair.substring(eq + 1);
          if(k === 'User-Agent') ch.userAgent = v;
          if(k === 'Cookie')     ch.cookie    = v;
        });
      } else {
        ch.mpd = urlLine;
      }
      i++;
    }
    if(ch.mpd) channels.push(ch);
  }
  return channels;
}
function categoryOf(group, name){
  const g = (group || '').toLowerCase();
  const n = (name  || '').toLowerCase();
  if(/sport|cricket|football|tennis|khel/.test(g + n)) return 'sports';
  if(/movie|cinema|gold|thrills|romance/.test(g + n))  return 'movies';
  if(/kids|disney|junior|hungama/.test(g + n))          return 'kids';
  if(/music/.test(g + n))                               return 'music';
  return 'entertainment';
}
let activeFilter = 'all';
let searchQuery  = '';
let allCards     = [];
function applyFilters(){
  allCards.forEach(({el, name, cat}) => {
    const matchCat    = activeFilter === 'all' || cat === activeFilter;
    const matchSearch = name.toLowerCase().includes(searchQuery);
    el.style.display = (matchCat && matchSearch) ? 'block' : 'none';
  });
}
async function init(){
  try{
    const res = await fetch(M3U_URL + (M3U_URL.includes('?') ? '&' : '?') + '_=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const channels = parseM3U(text);
    document.getElementById('ch-count').textContent = channels.length;
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('grid');
    channels.forEach(ch => {
      const cat  = categoryOf(ch.group, ch.name);
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `player.html?id=${encodeURIComponent(ch.id)}`;
      const imgSrc = ch.logo || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><text y=%2248%22 font-size=%2248%22>📺</text></svg>';
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${imgSrc}" alt="${ch.name}" loading="lazy"
            onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><text y=%2248%22 font-size=%2248%22>📺</text></svg>'">
          <div class="card-live">LIVE</div>
        </div>
        <div class="card-body">
          <div class="card-name">${ch.name}</div>
          <span class="card-tag">${cat}</span><br>
          <div class="card-watch">▶ Watch</div>
        </div>`;
      grid.appendChild(card);
      allCards.push({el: card, name: ch.name, cat});
    });
    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        applyFilters();
      });
    });
    // Search
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      applyFilters();
    });
  }catch(e){
    document.getElementById('loading').innerHTML =
      `<span style="color:#ff5a5a">Failed to load playlist: ${e.message}. Check M3U_URL in the script.</span>`;
  }
}
init();
</script>
</body>
</html>
