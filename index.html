<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Live Channels</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0e1a;
    --surface:  #111827;
    --card:     #161d2e;
    --border:   #1e2d45;
    --gold:     #f5c518;
    --gold2:    #e8a900;
    --green:    #00d46a;
    --muted:    #64748b;
    --text:     #e2e8f0;
    --radius:   10px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* ── HERO ── */
  header {
    position: relative;
    overflow: hidden;
    padding: 56px 24px 44px;
    text-align: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(245,197,24,.18) 0%, transparent 70%),
      linear-gradient(180deg, #0d1526 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg, rgba(245,197,24,.03) 0px, rgba(245,197,24,.03) 1px, transparent 1px, transparent 60px
    ), repeating-linear-gradient(
      0deg,  rgba(245,197,24,.03) 0px, rgba(245,197,24,.03) 1px, transparent 1px, transparent 60px
    );
    pointer-events: none;
  }

  .badge {
    display: inline-block;
    background: var(--gold);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: 1;
    letter-spacing: -.01em;
    color: #fff;
  }

  h1 span { color: var(--gold); }

  .subtitle {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .04em;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10,14,26,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 9px 12px 9px 38px;
    outline: none;
    transition: border-color .2s;
  }

  #search:focus { border-color: var(--gold); }
  #search::placeholder { color: var(--muted); }

  .count-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .count-pill strong { color: var(--gold); }

  /* ── GRID ── */
  main {
    max-width: 1300px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    position: relative;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 8px 32px rgba(245,197,24,.12);
  }

  .card-thumb {
    background: linear-gradient(135deg, #111827 0%, #0d1a30 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    height: 90px;
    position: relative;
    overflow: hidden;
  }

  .card-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.5) 100%);
  }

  .card-thumb img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    position: relative;
    z-index: 1;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    padding: 6px;
  }

  .play-icon {
    position: absolute;
    right: 10px;
    top: 10px;
    z-index: 2;
    width: 26px;
    height: 26px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(.8);
    transition: opacity .18s, transform .18s;
  }

  .card:hover .play-icon { opacity: 1; transform: scale(1); }

  .play-icon svg { width: 12px; height: 12px; fill: #000; margin-left: 1px; }

  .card-body {
    padding: 12px 14px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ch-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    line-height: 1.25;
    letter-spacing: .01em;
  }

  .ch-group {
    font-size: 11px;
    color: var(--green);
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* ── EMPTY STATE ── */
  #empty {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
  }

  #empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .4; }
  #empty p { font-size: 15px; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 500px) {
    #grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card-thumb { height: 70px; padding: 14px; }
    .card-thumb img { width: 40px; height: 40px; }
  }
</style>
</head>

// Deduplicate by fileName
const seen = new Set();
const unique = channels.filter(c => {
  if (seen.has(c.fileName)) return false;
  seen.add(c.fileName);
  return true;
});

const grid    = document.getElementById('grid');
const empty   = document.getElementById('empty');
const shownEl = document.getElementById('shown');
const totalEl = document.getElementById('total');
const search  = document.getElementById('search');

totalEl.textContent = unique.length;

function render(list) {
  // Remove existing cards
  grid.querySelectorAll('.card').forEach(el => el.remove());

  shownEl.textContent = list.length;
  empty.style.display = list.length === 0 ? 'block' : 'none';

  list.forEach(ch => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `channel/${ch.fileName}`;
    a.innerHTML = `
      <div class="card-thumb">
        <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\'><text y=\\'18\\' font-size=\\'18\\'>📺</text></svg>'">
        <div class="play-icon">
          <svg viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg>
        </div>
      </div>
      <div class="card-body">
        <div class="ch-name">${ch.name}</div>
        <div class="ch-group">⚽ ${ch.group}</div>
      </div>
    `;
    grid.appendChild(a);
  });
}

render(unique);

search.addEventListener('input', () => {
  const q = search.value.toLowerCase().trim();
  render(q ? unique.filter(c => c.name.toLowerCase().includes(q)) : unique);
});
