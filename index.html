<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportlink | FIFA WC Dashboard</title>
    <link rel="shortcut icon" href="https://www.jiotv.com/favicon.ico" />
    <meta name="description" content="Access 1000+ live TV channels with Sportlink's premium dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3c3c;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 60, 60, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 60, 60, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        header {
            padding: 2.5rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #ffffff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            max-width: 600px;
            margin: 1.5rem auto 0;
            position: relative;
        }

        #search {
            width: 100%;
            padding: 1.2rem 1.8rem;
            border-radius: 50px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(255, 60, 60, 0.15);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .channel-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--glass-border);
            aspect-ratio: 1/1;
            position: relative;
            overflow: hidden;
        }

        .channel-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--primary);
            background: rgba(255, 60, 60, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: var(--glass);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .channel-card:hover .icon-box {
            background: var(--primary);
            color: white;
            transform: rotate(5deg);
        }

        .channel-logo-img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            margin-bottom: 1rem;
            border-radius: 12px;
            transition: 0.3s;
        }

        .channel-card:hover .channel-logo-img {
            transform: scale(1.1);
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-dim);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            margin-top: 4rem;
        }

        .skeleton {
            background: var(--surface);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0 20px;
            margin-bottom: 20px;
            scrollbar-width: none;
            mask-image: linear-gradient(to right, black 80%, transparent 100%);
        }

        .filter-container::-webkit-scrollbar { display: none; }

        .filter-tag {
            padding: 8px 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .filter-tag:hover:not(.active) {
            background: var(--glass-border);
            color: var(--text);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
            .container { padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>FIFA WC by Sportlink</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 5px;">by Sayan10</p>
        <div class="search-container">
            <input type="text" id="search" placeholder="Search 1000+ Channels..." autocomplete="off">
        </div>
        <div class="filter-container" id="filters">
            <!-- Filter tags will be injected here -->
        </div>
    </header>

    <div class="container">
        <div class="channel-grid" id="grid">
            <div class="channel-card skeleton"></div>
            <div class="channel-card skeleton"></div>
            <div class="channel-card skeleton"></div>
            <div class="channel-card skeleton"></div>
            <div class="channel-card skeleton"></div>
            <div class="channel-card skeleton"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sportlink Premium. All rights reserved.</p>
    </footer>

    <script>
        const grid = document.getElementById('grid');
        const search = document.getElementById('search');
        const filterContainer = document.getElementById('filters');
        let channelsData = [];
        let activeCategory = 'All';

        async function init() {
            try {
                const response = await fetch('channel/channels.json');
                channelsData = await response.json();
                renderFilters();
                updateDisplay();
            } catch (error) {
                console.error('Error loading channels:', error);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Failed to load channels.</p>';
            }
        }

        function renderFilters() {
            const categories = ['All', ...new Set(channelsData.map(ch => ch.category))];
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                if (!cat) return;
                const tag = document.createElement('div');
                tag.className = `filter-tag ${cat === activeCategory ? 'active' : ''}`;
                tag.textContent = cat;
                tag.onclick = () => {
                    activeCategory = cat;
                    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    updateDisplay();
                };
                filterContainer.appendChild(tag);
            });
        }

        function updateDisplay() {
            const term = search.value.toLowerCase();
            const filtered = channelsData.filter(ch => {
                const matchesSearch = ch.name.toLowerCase().includes(term);
                const matchesCat = activeCategory === 'All' || ch.category === activeCategory;
                return matchesSearch && matchesCat;
            });
            displayChannels(filtered);
        }

        function displayChannels(list) {
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; opacity: 0.5; padding: 40px;">No channels found.</p>';
                return;
            }
            list.forEach(ch => {
                const card = document.createElement('a');
                card.className = 'channel-card';
                card.href = 'channel/' + ch.fileName;
                
                const acronym = ch.name.split(/[\s_]/).map(w => w[0]).join('').substring(0, 3).toUpperCase();
                
                let iconHtml = `<div class="icon-box">${acronym}</div>`;
                if (ch.logo) {
                    iconHtml = `<img src="${ch.logo}" alt="${ch.name}" class="channel-logo-img" onerror="this.outerHTML='<div class=\\'icon-box\\'>${acronym}</div>'">`;
                }

                card.innerHTML = `
                    ${iconHtml}
                    <div class="channel-name">${ch.name.replace(/_/g, ' ')}</div>
                `;
                grid.appendChild(card);
            });
        }

        search.addEventListener('input', updateDisplay);

        init();
    </script>
</body>
</html>
