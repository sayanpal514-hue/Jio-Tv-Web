<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Sports · SportLink</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top left, rgba(220, 20, 60, 0.25), transparent 40%),
        radial-gradient(circle at bottom right, rgba(0, 80, 200, 0.18), transparent 40%),
        linear-gradient(145deg, #0a0a0a, #161616);
      z-index: -2;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 18px 20px 12px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.4), transparent);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #e0e0e0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .brand span {
      color: #dc143c;
      font-weight: 900;
    }

    .hero {
      padding: 30px 20px 20px;
    }

    .hero h1 {
      font-size: 36px;
      line-height: 1.1;
      max-width: 720px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .hero p {
      color: #b0b0b0;
      font-size: 15px;
      max-width: 600px;
      font-weight: 400;
    }

    .search-wrap {
      padding: 0 20px 24px;
    }

    .search-box {
      width: 100%;
      max-width: 540px;
      padding: 14px 20px;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(20, 20, 20, 0.85);
      color: #f5f5f5;
      outline: none;
      font-size: 15px;
      backdrop-filter: blur(4px);
      transition: 0.2s;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    .search-box:focus {
      border-color: #dc143c;
      background: rgba(10, 10, 10, 0.9);
      box-shadow: 0 0 0 4px rgba(220, 20, 60, 0.25);
    }

    .section-title {
      padding: 0 20px;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
      color: #eaeaea;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      padding: 0 20px 50px;
    }

    .card {
      position: relative;
      min-height: 215px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
      transition: 0.25s ease;
    }

    .card:hover {
      transform: scale(1.04) translateY(-6px);
      border-color: rgba(220, 20, 60, 0.6);
      box-shadow: 0 22px 56px rgba(220, 20, 60, 0.25);
      z-index: 5;
    }

    .poster {
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.06), transparent 60%),
        linear-gradient(135deg, #1e1e1e, #080808);
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 16px;
      background: #f5f5f5;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
      transition: 0.2s;
    }

    .fallback-logo {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dc143c, #8b0000);
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 20px rgba(220, 20, 60, 0.4);
    }

    .content {
      padding: 14px 14px 16px;
      background: linear-gradient(to top, #0c0c0c, rgba(0, 0, 0, 0.8));
    }

    .name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      min-height: 36px;
      color: #f0f0f0;
    }

    .meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: #9a9a9a;
      font-weight: 500;
    }

    .live {
      color: #fff;
      background: #dc143c;
      padding: 3px 9px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .watch {
      margin-top: 12px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 9px 0;
      color: #fff;
      background: #dc143c;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }

    .watch:hover {
      background: #b01030;
    }

    .error {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 40px;
      color: #ff7a7a;
      font-size: 17px;
      font-weight: 500;
    }

    @media (max-width: 540px) {
      .brand {
        font-size: 22px;
      }
      .hero h1 {
        font-size: 28px;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        padding: 0 14px 40px;
      }
      .card {
        min-height: 190px;
      }
      .poster {
        height: 115px;
      }
      .logo {
        width: 66px;
        height: 66px;
        padding: 8px;
      }
      .fallback-logo {
        width: 66px;
        height: 66px;
        font-size: 26px;
      }
      .content {
        padding: 10px 12px 14px;
      }
      .name {
        font-size: 12px;
        min-height: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">Star <span>Sports</span> · SportLink</div>
  </div>

  <section class="hero">
    <h1>Watch live sports · instant</h1>
    <p>Pick your channel and start streaming right away.</p>
  </section>

  <div class="search-wrap">
    <input id="searchInput" class="search-box" type="text" placeholder="Search channels..." />
  </div>

  <h2 class="section-title">🔥 Live channels</h2>

  <div id="channelGrid" class="grid"></div>

  <script>
    const JSON_URL = "https://binge-giotv.pages.dev/data/id.json";
    const PLAYER_PAGE = "player.html";

    const grid = document.getElementById("channelGrid");
    const searchInput = document.getElementById("searchInput");

    let allChannels = [];

    async function loadChannels() {
      try {
        const res = await fetch(JSON_URL);
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        allChannels = data.channels || [];
        renderChannels(allChannels);
      } catch (e) {
        console.error(e);
        grid.innerHTML = `<div class="error">⚠️ Could not load channels. Please try again.</div>`;
      }
    }

    function renderChannels(channels) {
      grid.innerHTML = "";

      if (!channels || channels.length === 0) {
        grid.innerHTML = `<div class="error">No channels match your search</div>`;
        return;
      }

      channels.forEach((channel) => {
        const card = document.createElement("div");
        card.className = "card";

        const logo = channel.logo || channel.image || channel.icon || "";
        const firstLetter = (channel.name || channel.id || "?").charAt(0).toUpperCase();

        card.innerHTML = `
          <div class="poster">
            ${
              logo
                ? `<img class="logo" src="${logo}" alt="${channel.name || channel.id}" loading="lazy">`
                : `<div class="fallback-logo">${firstLetter}</div>`
            }
          </div>

          <div class="content">
            <div class="name">${channel.name || channel.id}</div>

            <div class="meta">
              <span>ID: ${channel.id}</span>
              <span class="live">● Live</span>
            </div>

            <button class="watch">▶ Watch</button>
          </div>
        `;

        card.addEventListener("click", () => {
          window.location.href = `${PLAYER_PAGE}?id=${encodeURIComponent(channel.id)}`;
        });

        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();

      const filtered = allChannels.filter((channel) =>
        (channel.name || "").toLowerCase().includes(q) ||
        (channel.id || "").toLowerCase().includes(q)
      );

      renderChannels(filtered);
    });

    // load channels
    loadChannels();
  </script>
</body>
</html>
