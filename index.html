<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="shortcut icon" href="https://www.jiotv.com/favicon.ico" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --c1: #6366f1;
      --c2: #8b5cf6;
      --c3: #ec4899;
      --c4: #f97316;
      --c5: #10b981;
      --c6: #06b6d4;
      --bg: #070710;
      --bg2: #0d0d1a;
      --bg3: #121224;
      --bg4: #16162e;
      --text: #e2e8f0;
      --muted: #475569;
      --border: rgba(99,102,241,.15);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%; height:100%;
      background:var(--bg);
      overflow:hidden;
      font-family:'Inter',system-ui,sans-serif;
      -webkit-user-select:none; user-select:none;
      -webkit-touch-callout:none;
      color:var(--text);
    }

    ::-webkit-scrollbar { width:3px }
    ::-webkit-scrollbar-track { background:transparent }
    ::-webkit-scrollbar-thumb {
      background:linear-gradient(180deg,var(--c1),var(--c3));
      border-radius:4px;
    }

    #bg-canvas {
      position:fixed; inset:0; z-index:0;
      pointer-events:none; opacity:.35;
    }

    #overlay {
      position:fixed; inset:0; z-index:9999;
      background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:20px;
    }
    .loader-ring {
      width:60px; height:60px;
      position:relative;
    }
    .loader-ring svg { animation:spin 1.2s cubic-bezier(.5,0,.5,1) infinite }
    @keyframes spin { to { transform:rotate(360deg) } }

    .loader-dots {
      display:flex; gap:6px; align-items:center;
    }
    .loader-dots span {
      width:6px; height:6px; border-radius:50%;
      background:var(--c1);
      animation:bounce .9s ease-in-out infinite;
    }
    .loader-dots span:nth-child(2) { background:var(--c2); animation-delay:.15s; }
    .loader-dots span:nth-child(3) { background:var(--c3); animation-delay:.3s; }
    @keyframes bounce {
      0%,100% { transform:translateY(0); opacity:.4 }
      50%      { transform:translateY(-6px); opacity:1 }
    }
    #loadMsg {
      color:var(--muted); font-size:12px; font-weight:500;
      letter-spacing:.6px; text-align:center;
    }

    #status {
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      right:max(14px,env(safe-area-inset-right));
      z-index:9997;
      padding:6px 16px;
      font-size:11px; font-weight:600; letter-spacing:.3px;
      border-radius:24px;
      pointer-events:none;
      opacity:0; transform:translateY(-6px);
      transition:opacity .3s,transform .3s;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      max-width:260px;
    }
    #status.show  { opacity:1; transform:translateY(0) }
    #status.ok    { background:rgba(16,185,129,.15); color:#10b981; border:1px solid rgba(16,185,129,.25) }
    #status.warn  { background:rgba(249,115,22,.15);  color:#fb923c; border:1px solid rgba(249,115,22,.25) }
    #status.err   { background:rgba(239,68,68,.15);   color:#f87171; border:1px solid rgba(239,68,68,.25) }

    #channel-list {
      position:fixed; inset:0; z-index:9998;
      background:var(--bg);
      display:none; flex-direction:column;
      overflow-y:auto; overflow-x:hidden;
      padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    }

    .header {
      display:flex; align-items:center; gap:12px;
      margin-bottom:18px; flex-wrap:wrap;
    }
    .logo-mark {
      width:38px; height:38px;
      background:linear-gradient(135deg,var(--c1),var(--c3));
      border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
      box-shadow:0 0 20px rgba(99,102,241,.4);
      animation:pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%,100% { box-shadow:0 0 20px rgba(99,102,241,.4) }
      50%      { box-shadow:0 0 35px rgba(236,72,153,.5) }
    }
    .header-text { flex:1; min-width:0 }
    .header-text h1 {
      font-size:20px; font-weight:900; letter-spacing:-.5px;
      background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; background-size:200%;
      animation:gradient-shift 4s linear infinite;
    }
    @keyframes gradient-shift {
      0%   { background-position:0% }
      100% { background-position:200% }
    }
    .header-text .tagline {
      font-size:10px; font-weight:500; color:var(--muted);
      letter-spacing:.6px; text-transform:uppercase; margin-top:1px;
    }
    #channelCount {
      font-size:11px; font-weight:600;
      background:rgba(99,102,241,.12);
      border:1px solid rgba(99,102,241,.2);
      color:var(--c1); padding:4px 12px; border-radius:20px;
      margin-left:auto;
    }

    #search-container {
      position:relative; margin-bottom:14px;
    }
    #search-input {
      width:100%;
      padding:11px 40px 11px 42px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--bg3);
      color:var(--text);
      font-size:13px; font-weight:500;
      outline:none;
      transition:all .3s;
      font-family:inherit;
    }
    #search-input:focus {
      border-color:rgba(99,102,241,.5);
      background:var(--bg4);
      box-shadow:0 0 0 3px rgba(99,102,241,.12),
                 0 0 20px rgba(99,102,241,.08);
    }
    #search-input::placeholder { color:var(--muted); font-size:12px }
    #search-icon {
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      font-size:15px; pointer-events:none; color:var(--muted);
    }
    #search-clear {
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      background:rgba(255,255,255,.06); border:none;
      color:var(--muted); font-size:13px; cursor:pointer;
      display:none; padding:3px 7px; border-radius:8px;
      transition:all .2s; line-height:1.4;
    }
    #search-clear:hover  { background:rgba(255,255,255,.1); color:#aaa }
    #search-clear.visible{ display:block }

    #category-filter {
      display:flex; gap:7px;
      overflow-x:auto; padding:2px 0 14px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none; flex-shrink:0;
    }
    #category-filter::-webkit-scrollbar { display:none }

    .filter-pill {
      flex-shrink:0;
      padding:5px 14px; border-radius:20px;
      font-size:10px; font-weight:700; letter-spacing:.4px;
      text-transform:uppercase; cursor:pointer;
      background:var(--bg3); color:var(--muted);
      border:1px solid var(--border);
      transition:all .25s; white-space:nowrap;
    }
    .filter-pill:hover { background:var(--bg4); color:var(--text) }
    .filter-pill.active {
      background:linear-gradient(135deg,var(--c1),var(--c2));
      color:#fff; border-color:transparent;
      box-shadow:0 4px 20px rgba(99,102,241,.35);
    }

    #ch-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
      gap:12px; padding-bottom:24px; width:100%;
    }

    .ch-card {
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px 12px;
      cursor:pointer; text-decoration:none;
      display:flex; flex-direction:column;
      align-items:center; text-align:center;
      gap:9px; min-height:128px;
      justify-content:center;
      position:relative; overflow:hidden;
      width:100%;
      transition:transform .25s cubic-bezier(.4,0,.2,1),
                 border-color .25s, box-shadow .25s;
    }
    .ch-card:hover {
      transform:translateY(-3px) scale(1.02);
      border-color:rgba(99,102,241,.45);
      box-shadow:
        0 8px 30px rgba(99,102,241,.15),
        0 0 0 1px rgba(99,102,241,.1);
    }
    .ch-card:active { transform:scale(.95) }

    .category-badge {
      position:absolute; top:8px; right:8px;
      font-size:7px; font-weight:700;
      text-transform:uppercase; letter-spacing:.5px;
      padding:2px 7px; border-radius:8px;
      opacity:.8;
      background:rgba(99,102,241,.12);
      color:#818cf8;
      border:1px solid #818cf833;
    }

    .ch-logo {
      width:100%; max-width:96px;
      height:auto; max-height:48px;
      object-fit:contain; border-radius:6px;
      padding:3px;
      transition:transform .3s;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }
    .ch-card:hover .ch-logo { transform:scale(1.08) }

    .ch-name {
      color:var(--text);
      font-size:11px; font-weight:600;
      line-height:1.3; letter-spacing:.1px;
      display:-webkit-box;
      -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; max-height:30px; width:100%;
    }

    .ch-placeholder {
      width:96px; height:48px;
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:800; letter-spacing:1px;
      background:rgba(99,102,241,.12);
      border:1px solid #818cf833;
      color:#818cf8;
    }

    #no-results {
      display:none; color:var(--muted);
      text-align:center; padding:60px 20px;
      font-size:13px; width:100%;
    }
    #no-results .icon { font-size:44px; margin-bottom:14px; display:block }

    #pc {
      position:fixed; inset:0; background:#000;
      display:none; align-items:center; justify-content:center;
      touch-action:manipulation;
    }
    video {
      width:100%; height:100%;
      object-fit:contain; background:#000;
      will-change:transform;
    }
    video.mode-fill  { object-fit:fill }
    video.mode-cover { object-fit:cover }

    .sp-btn {
      background:transparent!important; border:none!important;
      cursor:pointer!important; padding:0 8px!important;
      opacity:.8; display:flex; align-items:center;
      justify-content:center; gap:5px;
      height:100%; min-width:36px;
      transition:opacity .15s,color .15s;
      color:#fff!important;
      -webkit-tap-highlight-color:transparent;
    }
    .sp-btn:hover  { opacity:1 }
    .sp-btn:active { opacity:1; transform:scale(.92) }
    .sp-btn svg    { width:18px; height:18px; display:block; pointer-events:none; flex-shrink:0 }
    .sp-btn.active { opacity:1; color:var(--c1)!important }
    .fit-ratio {
      font-size:11px; font-weight:600; letter-spacing:.2px;
      line-height:1; white-space:nowrap; pointer-events:none;
    }
    .shaka-controls-container .shaka-play-button,
    .shaka-controls-container .shaka-mute-button,
    .shaka-controls-container .shaka-fullscreen-button,
    .shaka-controls-container .shaka-overflow-menu-button {
      color:var(--c1)!important;
    }
    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-played {
      background:linear-gradient(90deg,var(--c1),var(--c2))!important;
    }
    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-buffered {
      background:rgba(99,102,241,.3)!important;
    }

    @media(max-width:480px){
      #ch-grid { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:9px }
      .ch-card { min-height:108px; padding:12px 8px; border-radius:13px }
      .ch-logo { max-height:36px; max-width:76px }
      .ch-name { font-size:10px }
      .ch-placeholder { width:76px; height:36px; font-size:13px }
      .header-text h1 { font-size:17px }
    }
    @media(max-width:380px){
      #ch-grid { grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:7px }
      .ch-card { min-height:92px; padding:9px 6px; border-radius:11px }
      .ch-logo { max-height:30px; max-width:66px }
    }
    @media(min-width:768px){
      #ch-grid { grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:16px }
      .ch-card { min-height:148px; padding:20px 14px }
      .ch-logo { max-height:62px; max-width:120px }
      .ch-name { font-size:13px }
      .ch-placeholder { width:120px; height:62px; font-size:18px }
    }

    @media(prefers-reduced-motion:reduce){
      *, *::before, *::after { animation:none!important; transition:none!important }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="overlay">
  <div class="loader-ring">
    <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="24" stroke="#1e1e3a" stroke-width="5"/>
      <path d="M30 6 a24 24 0 0 1 24 24" stroke="url(#gg)" stroke-width="5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="gg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="loader-dots">
    <span></span><span></span><span></span>
  </div>
  <p id="loadMsg">Loading…</p>
</div>

<div id="status"></div>

<div id="channel-list">
  <div class="header">
    <div class="logo-mark">⚡</div>
    <div class="header-text">
      <h1>SPORTLINK</h1>
      <div class="tagline">JioTV+ · Live Streams</div>
    </div>
    <span id="channelCount">0 channels</span>
  </div>

  <div id="search-container">
    <span id="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search channels…" autocomplete="off">
    <button id="search-clear" aria-label="Clear search">✕</button>
  </div>

  <div id="category-filter"></div>
  <div id="ch-grid"></div>
  <div id="no-results">
    <span class="icon">📺</span>
    No channels match your search.
  </div>
</div>

<div id="pc">
  <video id="v" playsinline webkit-playsinline
    preload="none" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";

/* ── Animated background canvas ─────────────────────────── */
(function animateBG(){
  var canvas = document.getElementById('bg-canvas');
  var ctx    = canvas.getContext('2d');
  var orbs   = [];
  var COLORS  = ['#6366f1','#8b5cf6','#ec4899','#f97316','#06b6d4','#10b981'];

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(var i=0; i<7; i++){
    orbs.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: 120+Math.random()*180,
      dx: (Math.random()-.5)*.4,
      dy: (Math.random()-.5)*.4,
      color: COLORS[i%COLORS.length],
      phase: Math.random()*Math.PI*2
    });
  }

  function draw(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    orbs.forEach(function(o){
      o.x += o.dx;
      o.y += o.dy;
      var pulse = 1+.12*Math.sin(t*.0007+o.phase);
      if(o.x < -o.r || o.x > canvas.width+o.r)  o.dx *= -1;
      if(o.y < -o.r || o.y > canvas.height+o.r)  o.dy *= -1;
      var g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*pulse);
      g.addColorStop(0, o.color+'55');
      g.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(o.x,o.y,o.r*pulse,0,Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ── Category colour map ─────────────────────────────────── */
var CAT_COLORS = {
  'Sports':    { bg:'rgba(239,68,68,.15)',   text:'#f87171',  strip:'#ef4444,#f97316' },
  'News':      { bg:'rgba(6,182,212,.15)',   text:'#22d3ee',  strip:'#06b6d4,#6366f1' },
  'Movies':    { bg:'rgba(139,92,246,.15)',  text:'#a78bfa',  strip:'#8b5cf6,#ec4899' },
  'Kids':      { bg:'rgba(234,179,8,.15)',   text:'#fbbf24',  strip:'#eab308,#f97316' },
  'Music':     { bg:'rgba(236,72,153,.15)',  text:'#f472b6',  strip:'#ec4899,#8b5cf6' },
  'Lifestyle': { bg:'rgba(16,185,129,.15)',  text:'#34d399',  strip:'#10b981,#06b6d4' },
  'Infotainment':{ bg:'rgba(249,115,22,.15)',text:'#fb923c',  strip:'#f97316,#eab308' },
  'General':   { bg:'rgba(99,102,241,.12)',  text:'#818cf8',  strip:'#6366f1,#8b5cf6' }
};
var ACCENT_STRIPS = [
  '#6366f1,#8b5cf6','#ec4899,#f97316','#10b981,#06b6d4',
  '#f97316,#eab308','#8b5cf6,#ec4899','#06b6d4,#6366f1'
];
function catStyle(cat){
  return CAT_COLORS[cat] || {
    bg:'rgba(99,102,241,.12)', text:'#818cf8', strip:'#6366f1,#8b5cf6'
  };
}

/* ── Intersection observer for card reveal ───────────────── */
var revealObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if(e.isIntersecting){
      e.target.classList.add('visible');
      revealObserver.unobserve(e.target);
    }
  });
},{threshold:.06});

/* ── Config ─────────────────────────────────────────────── */
var API = "https://raw.githubusercontent.com/sportlive18/jio-tv-auto-update-playlist/refs/heads/main/jtvplus3.m3u";

var $overlay     = document.getElementById("overlay");
var $loadMsg     = document.getElementById("loadMsg");
var $status      = document.getElementById("status");
var $list        = document.getElementById("channel-list");
var $grid        = document.getElementById("ch-grid");
var $filter      = document.getElementById("category-filter");
var $searchInput = document.getElementById("search-input");
var $searchClear = document.getElementById("search-clear");
var $noResults   = document.getElementById("no-results");
var $channelCount= document.getElementById("channelCount");
var $pc          = document.getElementById("pc");
var $vid         = document.getElementById("v");
var _stTmr       = null;
var allChannels  = [];
var currentCategory = 'All';
var searchQuery  = '';

/* ── Device tier ─────────────────────────────────────────── */
function getTier(){
  var mem=navigator.deviceMemory||4, cores=navigator.hardwareConcurrency||4;
  var mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  var net=conn?(conn.effectiveType||"4g"):"4g";
  if(!mob) return"high";
  if(mem<=1.5||cores<=2||net==="slow-2g"||net==="2g") return"low";
  if(mem<=3||cores<=4) return"mid";
  return"high";
}
var TIER=getTier();
var PROF={
  low:{buf:5,reBuf:1.5,behind:15,maxH:480,maxBw:1200000,bwEst:400000},
  mid:{buf:8,reBuf:1.5,behind:25,maxH:720,maxBw:3500000,bwEst:1000000},
  high:{buf:12,reBuf:1.5,behind:30,maxH:1080,maxBw:0,bwEst:2000000}
}[TIER];

/* ── Fit modes ───────────────────────────────────────────── */
var FITS=['contain','fill','cover'];
var MODE_LABEL={contain:'Fit',fill:'Fill',cover:'Zoom'};
var FICO={
  contain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="21" x2="22" y2="21"/></svg>',
  fill:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  cover:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M6 7l3 3m0 0H7m2 0V8m9-1l-3 3m0 0h2m-2 0V8M6 13l3-3m0 0H7m2 0v2m9 1l-3-3m0 0h2m-2 0v2"/></svg>'
};
var PIP_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';

/* ── Helpers ─────────────────────────────────────────────── */
function toast(msg,type,dur){
  $status.textContent=msg;
  $status.className="show "+(type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur!==0){
    _stTmr=setTimeout(function(){
      $status.className=$status.className.replace("show","").trim();
      _stTmr=null;
    },dur||4000);
  }
}
function setMsg(m)     { $loadMsg&&($loadMsg.textContent=m) }
function hideOverlay() {
  $overlay.style.transition='opacity .4s ease';
  $overlay.style.opacity='0';
  setTimeout(function(){ $overlay.style.display='none'; },420);
}
function getChId()     { return new URLSearchParams(location.search).get("id")||"" }
function rawCookie(c)  { return c&&c.startsWith("__hdnea__=")?c.slice(10):(c||"") }
function withCookie(u,r){
  if(!u||!r) return u;
  if(u.indexOf("__hdnea__")!==-1) return u;
  return u+(u.indexOf("?")!==-1?"&":"?")+"__hdnea__="+r;
}

/* ── M3U Parser ─────────────────────────────────────────── */
function parseM3U(text) {
  var lines = text.split(/\r?\n/);
  var channels = [];
  var current = null;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('#EXTINF:')) {
      current = {};
      var attrRegex = /([a-zA-Z0-9-]+)="([^"]*)"/g;
      var match;
      while ((match = attrRegex.exec(line)) !== null) {
        var key = match[1];
        var val = match[2];
        if (key === 'tvg-id') current.id = val;
        else if (key === 'tvg-name') current.name = val;
        else if (key === 'tvg-logo') current.logo = val;
        else if (key === 'group-title') current.category = val;
      }
      var commaIdx = line.lastIndexOf(',');
      if (commaIdx !== -1) {
        var namePart = line.substring(commaIdx + 1).trim();
        if (namePart) current.name = namePart;
      }
      if (!current.id) current.id = 'ch_' + channels.length;
      if (!current.name) current.name = current.id;
      if (!current.category) current.category = 'General';
      continue;
    }

    if (line.startsWith('#KODIPROP:')) {
      if (!current) continue;
      var prop = line.substring(10).trim();
      if (prop.startsWith('inputstream.adaptive.license_key=')) {
        var lk = prop.substring(prop.indexOf('=') + 1);
        var parts = lk.split(':');
        if (parts.length >= 2 && parts[0] !== 'null') {
          current.key_id = parts[0];
          current.key = parts[1];
        }
      }
      continue;
    }

    if (line.startsWith('#EXTHTTP:')) {
      if (!current) continue;
      var jsonStr = line.substring(9).trim();
      try {
        var httpData = JSON.parse(jsonStr);
        if (httpData.cookie) current.cookie = httpData.cookie;
      } catch (e) { /* ignore */ }
      continue;
    }

    if (line.startsWith('#EXTVLCOPT:')) {
      continue;
    }

    if (!line.startsWith('#')) {
      if (current) {
        current.stream_url = line;
        channels.push(current);
        current = null;
      }
    }
  }

  return channels;
}

/* ── Data ────────────────────────────────────────────────── */
async function loadData(){
  var r = await fetch(API, {cache: "no-store", headers: {Accept: "text/plain"}});
  if (!r.ok) throw new Error("HTTP " + r.status);
  var text = await r.text();
  var channels = parseM3U(text);
  if (!channels.length) throw new Error("No channels found");
  return { channels: channels };
}

/* ── Render ──────────────────────────────────────────────── */
function renderFilters(channels){
  var categories=['All'], cats={};
  channels.forEach(function(ch){
    if(ch.category && ch.category !== 'General') {
      cats[ch.category]=true;
    }
  });
  Object.keys(cats).sort().forEach(function(c){ categories.push(c); });
  var f=document.createDocumentFragment();
  categories.forEach(function(cat){
    var pill=document.createElement('span');
    pill.className='filter-pill'+(cat===currentCategory?' active':'');
    pill.textContent=cat; pill.dataset.category=cat;
    pill.addEventListener('click',function(){
      currentCategory=cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active',p.dataset.category===cat);
      });
      applyFilters();
    });
    f.appendChild(pill);
  });
  $filter.innerHTML='';
  $filter.appendChild(f);
}

function applyFilters(){
  var filtered=allChannels;
  if(currentCategory!=='All') filtered=filtered.filter(function(ch){ return ch.category===currentCategory; });
  if(searchQuery.trim()){
    var q=searchQuery.trim().toLowerCase();
    filtered=filtered.filter(function(ch){ return ch.name.toLowerCase().includes(q); });
  }
  renderChannels(filtered);
}

function renderChannels(filtered){
  $channelCount.textContent=filtered.length+' channels';
  if(!filtered.length){
    $grid.style.display='none'; $noResults.style.display='block'; return;
  }
  $grid.style.display='grid'; $noResults.style.display='none';

  var f=document.createDocumentFragment();
  filtered.forEach(function(ch, idx){
    var a=document.createElement('a');
    a.className='ch-card';
    a.href='?id='+encodeURIComponent(ch.id);

    var cs=catStyle(ch.category);
    var stripColors=cs.strip||ACCENT_STRIPS[idx%ACCENT_STRIPS.length];

    var strip=document.createElement('div');
    strip.className='accent-strip';
    strip.style.background='linear-gradient(90deg,'+stripColors+')';
    a.appendChild(strip);

    if(ch.category && ch.category!=='General'){
      var badge=document.createElement('span');
      badge.className='category-badge';
      badge.textContent=ch.category;
      badge.style.background=cs.bg;
      badge.style.color=cs.text;
      badge.style.border='1px solid '+cs.text+'33';
      a.appendChild(badge);
    }

    if(ch.logo && ch.logo.trim()){
      var img=document.createElement('img');
      img.className='ch-logo';
      img.src=ch.logo; img.alt=ch.name; img.loading='lazy';
      img.onerror=function(){ this.style.display='none'; };
      a.appendChild(img);
    } else {
      var words=ch.name.split(' ').slice(0,2);
      var initials=words.map(function(w){ return w[0]||'' }).join('');
      var ph=document.createElement('div');
      ph.className='ch-placeholder';
      ph.style.background=cs.bg;
      ph.style.border='1px solid '+cs.text+'33';
      ph.style.color=cs.text;
      ph.textContent=initials;
      a.appendChild(ph);
    }

    var nm=document.createElement('span');
    nm.className='ch-name'; nm.textContent=ch.name;
    a.appendChild(nm);

    f.appendChild(a);
    revealObserver.observe(a);
  });

  $grid.innerHTML='';
  $grid.appendChild(f);
}

function renderList(data){
  var channels=data.channels||data;
  allChannels=channels;
  renderFilters(channels);
  applyFilters();
  $list.style.display='flex';
  $list.style.opacity='0';
  requestAnimationFrame(function(){
    $list.style.transition='opacity .4s ease';
    $list.style.opacity='1';
  });
  hideOverlay();
}

/* ── Search ──────────────────────────────────────────────── */
function handleSearch(){
  searchQuery=$searchInput.value;
  $searchClear.classList.toggle('visible',searchQuery.length>0);
  applyFilters();
}
$searchInput.addEventListener('input',handleSearch);
$searchClear.addEventListener('click',function(){
  $searchInput.value=''; searchQuery='';
  $searchClear.classList.remove('visible');
  applyFilters(); $searchInput.focus();
});
$searchInput.addEventListener('keydown',function(e){ if(e.key==='Escape') $searchClear.click(); });

/* ── Player helpers ──────────────────────────────────────── */
function errMsg(msg){ setMsg(msg); $overlay.style.display='flex'; toast(msg,'err',0); }
function shakaErrStr(e){
  if(!e) return"Unknown error";
  var c={1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Streaming",6:"DRM",7:"Player"};
  var s=(c[e.category]||"Err")+" "+e.category+":"+e.code;
  if(e.data&&e.data[0]&&typeof e.data[0]==="string") s+=" — "+e.data[0].slice(0,72);
  return s;
}
function ratioLabel(w,h){
  if(!w||!h) return"";
  function gcd(a,b){ return b?gcd(b,a%b):a; }
  var g=gcd(w,h)||1,rw=w/g,rh=h/g;
  var common={"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2};
  var real=w/h,best=null,bestDiff=.02;
  Object.keys(common).forEach(function(k){
    var d=Math.abs(common[k]-real);
    if(d<bestDiff){bestDiff=d;best=k;}
  });
  if(best) return best;
  if(rw<=40&&rh<=40) return rw+":"+rh;
  return real.toFixed(2)+":1";
}

function injectControls(container,vid,player){
  var panel=container.querySelector(".shaka-controls-button-panel");
  if(!panel) return;
  var anchor=panel.querySelector(".shaka-fullscreen-button");

  var fitIdx=0;
  var fitBtn=document.createElement("button");
  fitBtn.className="sp-btn sp-fit-btn";
  fitBtn.title="Video fit: Fit";
  fitBtn.innerHTML='<span class="fit-icon">'+FICO.contain+'</span><span class="fit-ratio">--</span>';
  if(anchor) panel.insertBefore(fitBtn,anchor); else panel.appendChild(fitBtn);

  function applyFit(i){
    fitIdx=i; var m=FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m==="fill") vid.classList.add("mode-fill");
    if(m==="cover") vid.classList.add("mode-cover");
    var ic=fitBtn.querySelector(".fit-icon");
    if(ic) ic.innerHTML=FICO[m];
    fitBtn.title="Video fit: "+MODE_LABEL[m];
  }
  fitBtn.addEventListener("click",function(e){ e.stopPropagation(); applyFit((fitIdx+1)%FITS.length); });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev,function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement)) applyFit(0);
    });
  });
  function updateRatio(){
    var lbl=ratioLabel(vid.videoWidth,vid.videoHeight);
    var badge=fitBtn.querySelector(".fit-ratio");
    if(badge&&lbl) badge.textContent=lbl;
  }
  vid.addEventListener("loadedmetadata",updateRatio);
  vid.addEventListener("resize",updateRatio);
  updateRatio();

  var pipOk=!!(document.pictureInPictureEnabled||
    (vid.webkitSupportsPresentationMode&&typeof vid.webkitSetPresentationMode==="function"));
  if(pipOk){
    var pipBtn=document.createElement("button");
    pipBtn.className="sp-btn sp-pip-btn";
    pipBtn.title="Picture in Picture";
    pipBtn.innerHTML=PIP_ICON;
    panel.insertBefore(pipBtn,fitBtn);
    function setPipState(active){
      pipBtn.classList.toggle("active",active);
      pipBtn.title=active?"Exit PiP":"Picture in Picture";
    }
    pipBtn.addEventListener("click",async function(e){
      e.stopPropagation();
      try{
        if(document.pictureInPictureEnabled){
          if(document.pictureInPictureElement) await document.exitPictureInPicture();
          else await vid.requestPictureInPicture();
        } else if(vid.webkitSupportsPresentationMode){
          vid.webkitSetPresentationMode(
            vid.webkitPresentationMode==="picture-in-picture"?"inline":"picture-in-picture");
        }
      } catch(_){ toast("PiP unavailable","warn",2500); }
    });
    vid.addEventListener("enterpictureinpicture",function(){ setPipState(true); });
    vid.addEventListener("leavepictureinpicture",function(){ setPipState(false); });
    if(vid.webkitPresentationMode!==undefined){
      vid.addEventListener("webkitpresentationmodechanged",function(){
        setPipState(vid.webkitPresentationMode==="picture-in-picture");
      });
    }
  }
}

/* ── Player ──────────────────────────────────────────────── */
async function startPlayer(ch){
  $pc.style.display="flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser not supported."); return; }
  var player=new shaka.Player();
  await player.attach($vid);
  new shaka.ui.Overlay(player,$pc,$vid).configure({
    controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"],
    seekBarColors:{base:"#334155",buffered:"rgba(99,102,241,.4)",played:"#6366f1"}
  });
  setTimeout(function(){ injectControls($pc,$vid,player); },100);

  var cookie=ch.cookie, raw=rawCookie(cookie);
  var keyId=ch.key_id, key=ch.key, url=ch.stream_url;
  var restrictionsRelaxed=false;

  function buildCfg(){
    var restr={};
    if(!restrictionsRelaxed){
      if(PROF.maxH<1080) restr.maxHeight=PROF.maxH;
      if(PROF.maxBw>0)   restr.maxBandwidth=PROF.maxBw;
    }
    var cfg={
      manifest:{defaultPresentationDelay:4,ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      streaming:{lowLatencyMode:false,bufferingGoal:PROF.buf,rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,safeSeekOffset:4,stallEnabled:true,stallThreshold:1,stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}},
      abr:{enabled:true,defaultBandwidthEstimate:PROF.bwEst,switchInterval:4,restrictions:restr}
    };
    if(keyId&&key) cfg.drm={clearKeys:{[keyId]:key}};
    return cfg;
  }
  player.configure(buildCfg());

  var T=shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type,req){
    req.headers["Referer"]="https://www.jiotv.com/";
    req.headers["User-Agent"]="Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    if(cookie) req.headers["Cookie"]=cookie;
    if(type===T.MANIFEST||type===T.SEGMENT)
      req.uris=req.uris.map(function(u){ return withCookie(u,raw); });
  });

  var refreshing=false,retries=0,edgeTried=false,lastTry=0,started=false;
  function unmuteOnce(){ $vid.muted=false; }
  $pc.addEventListener("pointerdown",unmuteOnce,{capture:true,once:true});
  $pc.addEventListener("click",unmuteOnce,{capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{ player.goToLive(); edgeTried=true; toast("Syncing…","warn",2000); }
    catch(_){ reload(); }
  }
  async function reload(){
    var now=Date.now();
    if(refreshing||now-lastTry<1500) return;
    if(retries>=5){ toast("Stream unavailable.","err",0); return; }
    refreshing=true; lastTry=now; retries++;
    toast("Reconnecting… ("+retries+"/5)","warn",0);
    try{
      var d=await loadData();
      var channels=d.channels||d;
      var fresh=channels.find(function(c){ return c.id===ch.id; });
      if(!fresh) throw new Error("missing");
      cookie=fresh.cookie; raw=rawCookie(cookie);
      keyId=fresh.key_id; key=fresh.key; url=fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries=0; edgeTried=false; toast("● Live","ok",4000);
    } catch(_){
      setTimeout(reload,Math.min(1000*Math.pow(2,retries-1),8000));
    } finally{ refreshing=false; }
  }

  var RECOVERABLE=[1001,1002,1003,4012,6006,6007,7000,7001,7002];
  player.addEventListener("error",function(ev){
    var err=ev.detail,code=err&&err.code;
    if(code===4014&&!restrictionsRelaxed){
      restrictionsRelaxed=true; refreshing=true;
      player.configure(buildCfg());
      toast("Playing best available quality","warn",2500);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("● Live","ok",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing=false; });
      return;
    }
    if(RECOVERABLE.indexOf(code)!==-1) reload();
    else toast(shakaErrStr(err),"err",6000);
  });

  try{
    setMsg("Loading stream…"); toast("Loading…","warn",0);
    await player.load(url);
    hideOverlay(); toast("Tap ▶ to start","ok",5000);
  } catch(_){
    hideOverlay(); toast("Retrying…","warn",0);
    setTimeout(reload,1500); return;
  }

  var stallTmr=null;
  function onStall(){
    if(!started||stallTmr||refreshing) return;
    toast("Buffering…","warn",0);
    stallTmr=setTimeout(function(){
      stallTmr=null;
      if(!edgeTried) goLiveEdge(); else reload();
    },5000);
  }
  function onPlaying(){
    started=true;
    if(stallTmr){ clearTimeout(stallTmr); stallTmr=null; }
    edgeTried=false;
    if(!refreshing) toast("● Live","ok",3000);
  }
  $vid.addEventListener("waiting",onStall);
  $vid.addEventListener("stalled",onStall);
  $vid.addEventListener("playing",onPlaying);
  $vid.addEventListener("error",function(){ if(!refreshing) reload(); });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) setTimeout(function(){
      if(started&&$vid.paused&&!refreshing) $vid.play().catch(function(){});
    },400);
  });
  var netConn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change",function(){
      if(!player||restrictionsRelaxed) return;
      var t=netConn.effectiveType||"4g";
      var h=t==="slow-2g"||t==="2g"?240:t==="3g"?480:PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight",h); } catch(_){}
      if(h<PROF.maxH) toast("Slow network — reducing quality","warn",3000);
    });
  }
}

/* ── Main ────────────────────────────────────────────────── */
async function main(){
  var id=getChId(),data;
  try{ setMsg("Fetching channels…"); data=await loadData(); }
  catch(_){ errMsg("Connection error."); return; }
  if(!id){ renderList(data); return; }
  var channels=data.channels||data;
  var ch=channels.find(function(c){ return c.id===id; });
  if(!ch){ errMsg("Channel not found."); return; }
  document.title="SPORTLINK · "+ch.name;
  await startPlayer(ch);
}
document.addEventListener("DOMContentLoaded",main);
})();
</script>
