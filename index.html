<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JIO TV · Live Channels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* --- base & reset --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #080a0f;
      --surface: #0e1219;
      --card: #131820;
      --border: rgba(255,255,255,0.06);
      --accent: #e8ff00;
      --accent2: #ff3d3d;
      --text: #f0f4ff;
      --muted: rgba(240,244,255,0.45);
      --radius: 14px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,10,15,0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 26px;
      letter-spacing: 3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo span { color: var(--accent); }
    .live-badge {
      background: var(--accent2);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .updated {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .hero {
      padding: 48px 24px 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(232,255,0,0.03) 0%, transparent 100%);
    }
    .hero h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(40px, 8vw, 96px);
      letter-spacing: 6px;
      line-height: 1;
      color: var(--text);
    }
    .hero h1 em { color: var(--accent); font-style: normal; }
    .hero p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 1px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px 20px;
      justify-content: center;
      align-items: center;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all .2s;
      font-family: 'DM Sans', sans-serif;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    /* --- search box --- */
    .search-wrapper {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px 4px 4px 16px;
      min-width: 180px;
      transition: border-color .2s;
      flex: 1 1 200px;
    }
    .search-wrapper:focus-within {
      border-color: var(--accent);
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 400;
      padding: 6px 0;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
    }
    .search-wrapper input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }
    .search-wrapper button {
      background: var(--accent);
      border: none;
      border-radius: 100px;
      color: #000;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
      transition: background .2s;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .search-wrapper button:hover {
      background: #d4e600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      padding: 0 24px 60px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(232,255,0,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(232,255,0,0.1);
    }
    .card-thumb {
      aspect-ratio: 16/9;
      background: #0a0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .card-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.6));
    }
    .card-thumb img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
      transition: transform .25s;
    }
    .card:hover .card-thumb img { transform: scale(1.08); }
    .card-live-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.6);
      border-radius: 100px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      color: #ff5a5a;
      letter-spacing: 0.5px;
    }
    .card-live-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ff3d3d;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .card-body {
      padding: 14px 14px 16px;
    }
    .card-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }
    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .card-watch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 100px;
      transition: opacity .2s;
    }
    .card:hover .card-watch { opacity: 0.85; }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: 42px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 14px 40px; }
      header { padding: 0 14px; height: auto; min-height: 64px; }
      .hero { padding: 32px 14px 24px; }
      .filter-bar { padding: 0 14px 16px; }
      .search-wrapper { min-width: 140px; }
      .search-wrapper input { font-size: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡JIO <span>TV</span></div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div class="live-badge">● LIVE</div>
    <div class="updated" id="updated-time"></div>
  </div>
</header>

<section class="hero">
  <h1>WATCH <em>LIVE</em><br></h1>
  <p>All JIO TV CHANNEL · HD Quality · Zero Cost</p>
</section>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-filter="all">All Channels</button>
  <button class="filter-btn" data-filter="hindi">Hindi</button>
  <button class="filter-btn" data-filter="english">English</button>
  <button class="filter-btn" data-filter="tamil">Tamil</button>
  <button class="filter-btn" data-filter="telugu">Telugu</button>
  <button class="filter-btn" data-filter="kannada">Kannada</button>
  <button class="filter-btn" data-filter="sports">Sports</button>
  <button class="filter-btn" data-filter="movies">Movies</button>
  <!-- search box -->
  <div class="search-wrapper">
    <input type="text" id="search-input" placeholder="Search channels..." aria-label="Search channels">
    <button id="search-btn">Search</button>
  </div>
</div>

<div id="loading"><div class="spinner"></div> Fetching channels…</div>
<div class="grid" id="grid" style="display:none"></div>

<footer>Data auto-fetched · Tap any channel to watch</footer>

<script>
  (function() {
    // ----- CONFIG -----
    const JSON_URL = 'https://sportlink-sky-f1.pages.dev/jtv.json';

    // ----- language / category detection -----
    function getChannelCategory(name) {
      const n = name.toLowerCase();
      if (n.includes('sports') || n.includes('ten') || n.includes('six')) return 'sports';
      if (n.includes('max') || n.includes('pix') || n.includes('wah') || n.includes('movies')) return 'movies';
      if (n.includes('hindi')) return 'hindi';
      if (n.includes('tamil')) return 'tamil';
      if (n.includes('telugu')) return 'telugu';
      if (n.includes('kannada')) return 'kannada';
      if (n.includes('malayalam')) return 'malayalam';
      if (n.includes('bengali')) return 'bengali';
      if (n.includes('marathi')) return 'marathi';
      return 'english';
    }

    function formatISTClock() {
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
      const h = String(ist.getHours()).padStart(2, '0');
      const m = String(ist.getMinutes()).padStart(2, '0');
      const s = String(ist.getSeconds()).padStart(2, '0');
      return h + ':' + m + ':' + s + ' IST';
    }

    // ----- DOM refs -----
    const loadingEl = document.getElementById('loading');
    const gridEl = document.getElementById('grid');
    const updatedTimeEl = document.getElementById('updated-time');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');

    // ----- clock -----
    function updateClock() {
      if (updatedTimeEl) updatedTimeEl.textContent = formatISTClock();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ----- state -----
    let allChannels = [];
    let currentFilter = 'all';
    let currentSearch = '';

    // ----- render (filter + search) -----
    function render() {
      const cards = document.querySelectorAll('.card');
      let visibleCount = 0;
      const searchLower = currentSearch.toLowerCase().trim();
      cards.forEach(card => {
        const category = card.dataset.lang || '';
        const name = card.dataset.name ? card.dataset.name.toLowerCase() : '';
        const matchFilter = currentFilter === 'all' || category === currentFilter;
        // match if search is empty OR channel name includes the search string (partial, anywhere)
        const matchSearch = searchLower === '' || name.includes(searchLower);
        if (matchFilter && matchSearch) {
          card.style.display = 'block';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });
      // show empty state if no visible cards
      const empty = document.querySelector('.empty-state');
      if (visibleCount === 0 && cards.length > 0) {
        if (!empty) {
          const div = document.createElement('div');
          div.className = 'empty-state';
          div.textContent = 'No channels match your filter or search.';
          gridEl.appendChild(div);
        }
      } else {
        if (empty) empty.remove();
      }
    }

    // ----- build grid from channels array -----
    function buildGrid(channels) {
      gridEl.innerHTML = '';
      channels.forEach(ch => {
        const category = getChannelCategory(ch.name);
        const card = document.createElement('a');
        card.className = 'card';
        const channelId = ch.id || ch.name.replace(/\s+/g, '-').toLowerCase();
        card.href = `player.html?id=${encodeURIComponent(channelId)}`;
        card.dataset.lang = category;
        card.dataset.name = ch.name;

        const logoUrl = ch.logo || '';
        const img = document.createElement('img');
        img.src = logoUrl;
        img.alt = ch.name;
        img.loading = 'lazy';
        img.onerror = function() {
          this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ctext y='45' font-size='44'%3E📺%3C/text%3E%3C/svg%3E";
        };

        const thumbDiv = document.createElement('div');
        thumbDiv.className = 'card-thumb';
        thumbDiv.appendChild(img);

        const dot = document.createElement('div');
        dot.className = 'card-live-dot';
        dot.textContent = 'LIVE';
        thumbDiv.appendChild(dot);

        const body = document.createElement('div');
        body.className = 'card-body';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'card-name';
        nameDiv.textContent = ch.name;

        const subDiv = document.createElement('div');
        subDiv.className = 'card-sub';
        const displayCategory = category.charAt(0).toUpperCase() + category.slice(1);
        subDiv.textContent = displayCategory + ' · HD';

        const watchBtn = document.createElement('div');
        watchBtn.className = 'card-watch';
        watchBtn.textContent = '▶ Watch Now';

        body.appendChild(nameDiv);
        body.appendChild(subDiv);
        body.appendChild(watchBtn);
        card.appendChild(thumbDiv);
        card.appendChild(body);
        gridEl.appendChild(card);
      });

      // apply current filter & search
      render();
    }

    // ----- fetch & init -----
    async function init() {
      try {
        const res = await fetch(JSON_URL + '?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const channels = await res.json();

        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';

        if (!channels || channels.length === 0) {
          gridEl.innerHTML = '<div class="empty-state">No channels available</div>';
          return;
        }

        allChannels = channels;
        buildGrid(channels);

        // ----- filter buttons -----
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
          btn.addEventListener('click', function(e) {
            filterBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            render();
          });
        });

        // ----- SEARCH: live as you type (every keystroke) -----
        function performSearch() {
          currentSearch = searchInput.value;
          render();
        }

        // search on every input event (typing)
        searchInput.addEventListener('input', performSearch);

        // also support search button click and enter key
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', function(e) {
          if (e.key === 'Enter') {
            performSearch();
          }
        });

      } catch (error) {
        loadingEl.innerHTML = '<span style="color:#ff5a5a;">⚠️ Failed to load channels. Please refresh.</span>';
        console.warn('Fetch error:', error);
      }
    }

    init();
  })();
</script>
</body>
</html>
